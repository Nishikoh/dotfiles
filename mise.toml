# dotfiles を mise bootstrap でセットアップするための設定 (対象 OS: Ubuntu, Arch。WSL を含む)
# https://mise.jdx.dev/bootstrap.html
# セットアップ手順は README.md を参照。
#
# ツール本体 ([tools]) は .config/mise/ のグローバル設定で管理する。
# このファイルは clone したリポジトリをマシンに配置するための宣言だけを持つ。

# mise dot と hook のテンプレート展開 ({{config_root}}) に 2026.9.8 以上が必要。
# hard にすると古い mise ではリポジトリ内で mise が使えなくなるので、警告だけにする
min_version = { soft = "2026.9.8" }

[bootstrap.packages]
"apt:zsh" = "latest"
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:vim" = "latest"
"apt:build-essential" = "latest" # rust (cargo) のリンカ
"apt:libatomic1" = "latest"      # mise の node が必要とする
"apt:gawk" = "latest"            # argc-completions の生成に使う
"pacman:zsh" = "latest"
"pacman:git" = "latest"
"pacman:curl" = "latest"
"pacman:vim" = "latest"
"pacman:base-devel" = "latest"   # rust (cargo) のリンカ
"pacman:gawk" = "latest"         # argc-completions の生成に使う

# codex は ~/.codex/config.toml に trust などを書き込むので、自分の設定は優先度が最も低い System 設定に置く。
# コピーなので、etc/codex/config.toml を編集したら mise bootstrap (files) で反映する
[bootstrap.directories."/etc/codex"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/codex/config.toml"]
source = "etc/codex/config.toml"
template = true
owner = "root"
group = "root"
mode = "0644"

[bootstrap.repos]
"~/setup/argc-completions" = { url = "https://github.com/sigoden/argc-completions.git" }
"~/.vim/pack/github/start/copilot.vim" = { url = "https://github.com/github/copilot.vim.git" }
"zsh/plugins/zsh-helix-mode" = { url = "https://github.com/Nishikoh/zsh-helix-mode.git", ref = "fix-utf-8-handling" }

[settings]
# `mise dot add -l ~/.config/foo` で、ホームからの相対パスのままこのリポジトリに取り込む
dotfiles.root = "~/setup/dotfiles"

# 相対パスの source はこのファイルのディレクトリ (リポジトリのルート) からの相対パス
[dotfiles]
"~/.gitconfig" = { source = ".gitconfig", mode = "symlink" }
"~/.vimrc" = { source = ".vimrc", mode = "symlink" }
"~/.zshrc" = { source = ".zshrc", mode = "symlink" }
"~/.config/helix" = { source = ".config/helix", mode = "symlink" }
"~/.config/lazygit" = { source = ".config/lazygit", mode = "symlink" }
"~/.config/mise" = { source = ".config/mise", mode = "symlink" }
"~/.config/starship.toml" = { source = ".config/starship.toml", mode = "symlink" }
"~/.config/yazi" = { source = ".config/yazi", mode = "symlink" }
# ~/.config/git には他のツール (omarchy など) が config を置くので、ディレクトリではなくファイルをリンクする
"~/.config/git/ignore" = { source = ".config/git/ignore", mode = "symlink" }
# ~/.config/herdr にはソケットやログもあるのでファイルをリンクする。WSL では mise.wsl.toml が config.wsl.toml に差し替える
"~/.config/herdr/config.toml" = { source = ".config/herdr/config.toml", mode = "symlink" }
"~/.claude/settings.json" = { source = ".claude/settings.json", mode = "symlink" }
"~/.claude/hooks" = { source = ".claude/hooks", mode = "symlink" }
"~/.claude/statusline-command.sh" = { source = ".claude/statusline-command.sh", mode = "symlink" }
"~/.claude/skills/dev-lsp" = { source = ".claude/skills/dev-lsp", mode = "symlink" }

[bootstrap.hooks]
# setup:completion の生成物で argc-completions が dirty になると repos フェーズが失敗するので、git から無視させる。
# 以前の手順で生成物が残っているマシンのために repos の前に、新しく clone したときのために後にも実行する
pre-repos = "sh '{{config_root}}/bootstrap/exclude-generated-files.sh'"
post-repos = "sh '{{config_root}}/bootstrap/exclude-generated-files.sh'"
post-dotfiles = [
  # `mise bootstrap --from` はその実行の間だけこの設定を信頼するので、clone 先で mise を使えるように trust しておく。
  # リポジトリ内の .config/mise/mise.toml もプロジェクトの設定として読まれるので一緒に信頼する。
  # (--all は実行中の一時的な信頼を見て何も記録しないので、パスを明示する)
  "mise trust --quiet '{{config_root}}'",
  "mise trust --quiet '{{config_root}}/.config/mise/mise.toml'",
  # WSL なのに WSL 以外の設定がリンクされたら失敗させる
  "sh '{{config_root}}/bootstrap/check-wsl-dotfiles.sh'",
]

# mise bootstrap の最後に毎回実行される
[tasks.bootstrap]
description = "mise bootstrap の宣言でカバーできないセットアップ"
depends = ["setup:completion"]

[tasks."setup:completion"]
description = "argc-completions の補完スクリプトを生成する"
dir = "{{env.HOME}}/setup/argc-completions"
# 生成はネットワークを使うので、argc-completions が更新されたときだけ実行する
sources = [
  "{{env.HOME}}/setup/argc-completions/.git/HEAD",
  "{{env.HOME}}/setup/argc-completions/.git/refs/heads/*",
]
outputs = ["{{env.HOME}}/setup/argc-completions/completions/lh.sh"]
run = '''
./scripts/download-tools.sh

argc generate git
git restore completions/

# lefthook wrapperの補完を追加
sed -e 's|${argc__args\[0\]}|lefthook|g' completions/lefthook.sh >completions/lh.sh

./scripts/setup-shell.sh zsh
'''

[tasks."setup:copilot"]
description = "GitHub Copilot CLI をセットアップする (対話的なログインが必要)"
run = '''
if ! gh copilot --version; then
	gh auth login --web -h github.com
	gh extension install github/gh-copilot --force
fi
echo "Start Vim/Neovim and invoke ':Copilot setup' ."
'''

[tasks."update:fzf-gcloud"]
description = "zsh/plugins/.fzf-gcloud.plugin.zsh を最新版に更新する"
run = "curl -fsSL https://raw.githubusercontent.com/mbhynes/fzf-gcloud/main/fzf-gcloud.plugin.zsh -o zsh/plugins/.fzf-gcloud.plugin.zsh"
