# WSL 用の herdr 設定。WSL では mise.wsl.toml がこのファイルを ~/.config/herdr/config.toml にリンクする。
# herdr には include が無いため、WSL 以外と共通のキーは config.toml と両方を編集する。

onboarding = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
host_cursor = "native" # ckj入力対策

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[theme]
name = "catppuccin-latte"

[remote]
manage_ssh_config = false # wslからsshする時に必要な設定

[experimental]
allow_nested = true
# reveal_hidden_cursor_for_cjk_ime = true
