# mise bootstrap が /etc/xdg/worktrunk/config.toml にコピーする System 設定。
# Worktrunk が書き込む ~/.config/worktrunk/config.toml / approvals.toml は管理しない。
# テンプレート変数は Worktrunk が shell escape するので引用符で囲まない。
# bare repo では primary_worktree_path が未定義なので、テンプレートの段階でスキップする。
# System 設定は全ユーザーが読むので、hook スクリプトを配置していないユーザー (sudo の root など) ではスキップする。
[post-switch]
herdr-open = '{% if primary_worktree_path %}if [ -f "$HOME/.config/worktrunk/herdr-hook.sh" ]; then bash "$HOME/.config/worktrunk/herdr-hook.sh" open {{ primary_worktree_path }} {{ worktree_path }} || true; fi{% endif %}'

# 削除後、対象 checkout の workspace で待機中の shell の pane を閉じ、最後の pane で workspace も閉じる。
# 何かを実行中の pane (エージェント、エディタ、dev server など) は残す。
[post-remove]
herdr-close = '{% if primary_worktree_path %}if [ -f "$HOME/.config/worktrunk/herdr-hook.sh" ]; then bash "$HOME/.config/worktrunk/herdr-hook.sh" close {{ primary_worktree_path }} {{ worktree_path }} || true; fi{% endif %}'
