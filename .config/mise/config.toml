[tools]
bun = "latest"
gh = "latest"
uv = "latest"
claude = "latest"
codex = "latest"

[settings]
experimental = true
npm.bun = true
npm.package_manager = "bun"
pipx.uvx = true
python.uv_venv_auto = "create|source" # 無ければ作って有効にする (true は非推奨)
minimum_release_age = "10d"

# 既定で外すツール (PATH に出したくないマシンが多いもの)。使うマシンは ~/.config/mise/config.local.toml で置き換える (README 参照)。
# 大きいだけで、置いておいても困らないもの (gcloud・terraform 関係など) は外さずに lazy にする (.config/mise/mise.toml)。
# rust は lazy でも cargo や rustc の shim が PATH で ~/.cargo/bin より前に来て、rustup の cargo を隠すので外す
# (rust にも lazy を付けているので、外すのをやめたマシンでは初めて cargo を実行したときに入る)
disable_tools = ["rust"]
