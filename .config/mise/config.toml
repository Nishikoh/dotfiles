[tools]
bun = "latest"
gh = "latest"
uv = "latest"
claude = "latest"
codex = "latest"

[settings]
experimental = true
npm.bun = true
npm.package_manager = "bun"
pipx.uvx = true
python.uv_venv_auto = "create|source" # 無ければ作って有効にする (true は非推奨)
minimum_release_age = "10d"

# 既定で外すツール (大きく、使わないマシンが多いもの)。使うマシンは ~/.config/mise/config.local.toml で置き換える (README 参照)
disable_tools = ["gcloud", "rust", "rclone", "github:tofuutils/tenv", "zellij"]
