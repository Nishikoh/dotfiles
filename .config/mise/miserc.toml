# WSL では wsl 環境を選び、リポジトリの mise.wsl.toml を読み込ませる。~/.config/mise はこのディレクトリへの symlink なので、グローバルの miserc になる。
# プロジェクトの .miserc.toml は信頼なしで読まれるので、mise 2026.10.19 からテンプレートで環境変数を読めない。そのためグローバルで判定する
# (WSL ではどのディレクトリでも wsl 環境になり、ほかのプロジェクトの mise.wsl.toml も読み込まれる)。
# miserc のテンプレートでは exec や read_file は使えないため WSL_DISTRO_NAME で判定する。
# この変数が無い実行 (ssh 経由や初回の --from) は mise.toml の post-dotfiles hook で検出して失敗させる。
env = [{% if get_env(name="WSL_DISTRO_NAME", default="") != "" %}"wsl"{% endif %}]
