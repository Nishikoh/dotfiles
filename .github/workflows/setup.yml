name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 新しい Ubuntu / Arch のコンテナで mise bootstrap が通ることを確かめる
  mise_bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, arch]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: mise bootstrap on ${{ matrix.os }}
        run: bash tests/test-mise-bootstrap.sh ${{ matrix.os }}
        env:
          # mise が GitHub API を呼ぶときのレート制限を避ける
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
