name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 新しい Ubuntu / Arch のコンテナで mise bootstrap が通ることを確かめる
  mise_bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, arch]
    steps:
      - uses: actions/checkout@v4

      - name: mise bootstrap on ${{ matrix.os }}
        run: bash tests/test-mise-bootstrap.sh ${{ matrix.os }}
        env:
          # mise が GitHub API を呼ぶときのレート制限を避ける
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
